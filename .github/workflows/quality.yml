name: Website quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check backend, frontend and inline JavaScript
        run: python3 scripts/check-js.py
      - name: Check page structure, assets, CSS and photo-frame contract
        run: python3 scripts/check-site.py
